patch:
  # 语言模型,不好用，权重太高了，动态调频都没法超过它
  # "grammar/language": wanxiang-lts-zh-hans
  # "grammar/collocation_max_length": 5
  # "grammar/collocation_min_length": 3

  "engine/filters":
    - lua_filter@*exact_match_first_filter
    - lua_filter@*corrector_filter
    - lua_filter@*super_preedit
    - lua_filter@*autocap_filter
    - simplifier@emoji_suggestion
    - simplifier@transcription_cc
    - lua_filter@*reduce_english_filter
    - uniquifier
  "translator/initial_quality": 1.0
  "melt_eng/initial_quality": 1.0

  'exact_match_first_filter/bonus_ratio': '0.35'
  'exact_match_first_filter/english_bonus_ratio': '0.8'
  'exact_match_first_filter/demote_ratio': '0.45'
  'exact_match_first_filter/min_length': '4'

  # # translator 内加载
  # "translator/contextual_suggestions": true
  # "translator/max_homophones": 7
  # "translator/max_homographs": 7

  # 设置「薄荷拼音-全拼输入」的词典，使用 rime_mint.custom.dict.yaml 文件
  translator/dictionary: rime_mint.custom

  # https://github.com/rime/home/issues/2033
  # "translator/dictionary/+": sougou

  "recognizer/patterns/gregorian_to_lunar": ""

  "speller/algebra/+":
    #  - derive_lookup # 如果已经存在这行，请勿重复添加
    #  - derive/^([a-z]+)[a-z]*$/$1/ # 如果已经存在这行，请勿重复添加
    - derive/^([zcs])h/$1/ # zh, ch, sh => z, c, s
    - derive/^([zcs])([^h])/$1h$2/ # z, c, s => zh, ch, sh

    - derive/([aei])n$/$1ng/ # en => eng, in => ing
    - derive/([aei])ng$/$1n/ # eng => en, ing => in

    - derive/([iu])an$/$1ang/ # ian => iang, uan => uang
    - derive/([iu])ang$/$1an/ # iang => ian, uang => uan

    # ------------------- un / ong / iong 智能模糊音 -------------------
    # 请删除所有旧的 un/ong 相关规则，替换为以下内容

    # 1. 处理 chun/chong, sun/song 这类情况 (un/ong)
    # 规则：只要不是 j, q, x, y 开头，就把结尾的 un 和 ong 互换
    # (?![jqxy]) 是一个“否定先行断言”，意思是“后面不跟着 j, q, x, y”
    - derive/^((?![jqxy]).*)un$/$1ong/  # chun -> chong
    - derive/^((?![jqxy]).*)ong$/$1un/  # chong -> chun

    # 2. 处理 jun/jiong, qun/qiong, xun/xiong 这类情况 (ün/iong)
    - derive/^([jqx])un$/$1iong/        # jun -> jiong
    - derive/^([jqx])iong$/$1un/        # jiong -> jun
    # 3. 单独处理 yun/yong，兼容多音节连续输入（如 yunjiu -> yongjiu）
    - derive/^yun$/yong/
    - derive/^yong$/yun/
    - derive/^yun([a-z].*)$/yong$1/
    - derive/^yong([a-z].*)$/yun$1/

    - derive/^n(.+)$/l$1/  # n/l 不分，但仅在后面有其他字符时生效（保护 n->你）
    - derive/^l(.+)$/n$1/  # l/n 不分，但仅在后面有其他字符时生效（保护 l->了）

    - abbrev/^([zcs]h).+$/$1/ #简拼（zh, ch, sh）
    - abbrev/^([a-z]).+$/$1/ #简拼（首字母）


    - erase/^xx$/ # 首选保留

